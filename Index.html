<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather App</h1>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button id="searchBtn">Search</button>
        </div>

        <div id="weatherInfo" class="weather-info hidden">
            <h2 id="cityName">City</h2>
            <div class="weather-icon" id="weatherIcon">🌡️</div>
            <p class="temp" id="temperature">--°C</p>
            <p class="condition" id="condition">Condition</p>
            
            <div class="details">
                <div class="detail-item">
                    <span>💧 Humidity</span>
                    <strong id="humidity">--%</strong>
                </div>
                <div class="detail-item">
                    <span>💨 Wind</span>
                    <strong id="windSpeed">-- m/s</strong>
                </div>
                <div class="detail-item">
                    <span>🌡️ Feels Like</span>
                    <strong id="feelsLike">--°C</strong>
                </div>
            </div>
        </div>

        <p id="errorMessage" class="error hidden">City not found. Please try again.</p>
        <p id="loadingMessage" class="loading hidden">Loading...</p>
    </div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
